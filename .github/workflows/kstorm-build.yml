# KStorm's own build. Started by hand from the Actions tab. Windows by default; Mac and Linux are optional.
# ReleaseFS_open needs no secrets: every package downloads anonymously, and the
# installer is unsigned because the signing helpers skip when their variables are unset.
name: KStorm build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Build Windows (untick every build for the shader check alone)'
        type: boolean
        default: true
      mac:
        description: 'Build Mac (not released)'
        type: boolean
        default: false
      linux:
        description: 'Build Linux (not released)'
        type: boolean
        default: false
      release_tag:
        description: 'Make a draft release with this tag, e.g. kstorm-7.2.5.12345 (needs Build Windows; blank for none)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      # Validates each changed shader in the variants the viewer compiles.
      - name: Validate shaders changed since master (GLSL 4.10)
        shell: bash
        run: bash scripts/ks_check_shaders.sh $(git diff --name-only --diff-filter=d origin/master...HEAD -- '*.glsl')

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 360
    # Only here, so that a shader-only run can't cancel a Windows build in progress.
    concurrency:
      group: kstorm-windows-${{ github.ref }}
      cancel-in-progress: true
    env:
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
    steps:
      # Full history: the build number is the commit count (indra/cmake/BuildVersion.cmake).
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout build vars (after the main code)
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set PYTHON environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install python requirements
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Cache third-party packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: autobuild-windows-${{ hashFiles('autobuild.xml') }}

      - name: Configure
        shell: bash
        run: autobuild configure -A 64 -c ReleaseFS_open -- --chan Research --no-opensim --avx2 --package -DLL_TESTS:BOOL=FALSE

      - name: Build
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Publish the installer
        uses: actions/upload-artifact@v7
        with:
          name: KStorm-windows
          path: build-*/newview/Release/*Setup.exe
          if-no-files-found: error
          retention-days: 7

  # Neither Mac nor Linux has a place in the release job, so a failure in either can't stop it.
  mac:
    if: ${{ inputs.mac }}
    runs-on: macos-15
    timeout-minutes: 360
    concurrency:
      group: kstorm-mac-${{ github.ref }}
      cancel-in-progress: true
    env:
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout build vars (after the main code)
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      # The build scripts need a newer bash and GNU sed than macOS ships.
      - name: Install Bash and GNU sed
        shell: bash
        run: |
          brew install bash gnu-sed
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set PYTHON environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install python requirements
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Cache third-party packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: autobuild-mac-${{ hashFiles('autobuild.xml') }}

      - name: Configure
        shell: bash
        run: autobuild configure -A 64 -c ReleaseFS_open -- --chan Research --no-opensim --package -DLL_TESTS:BOOL=FALSE

      # The libwebp package is Intel only, which fails the Apple chip link. Replaces it with the
      # same version built for both, one chip at a time so that each keeps its fast image code.
      - name: Make libwebp universal
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.2 https://github.com/webmproject/libwebp.git libwebp-src
          target="$(sed -n 's/^CMAKE_OSX_DEPLOYMENT_TARGET:STRING=//p' build-darwin-universal/CMakeCache.txt)"
          for arch in arm64 x86_64; do
            cmake -S libwebp-src -B "libwebp-$arch" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$arch" -DCMAKE_OSX_DEPLOYMENT_TARGET="$target" \
              -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF \
              -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_LIBWEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF
            cmake --build "libwebp-$arch" --target webp sharpyuv --parallel
          done
          for lib in libwebp libsharpyuv; do
            lipo -create "libwebp-arm64/$lib.a" "libwebp-x86_64/$lib.a" -output "build-darwin-universal/packages/lib/release/$lib.a"
            lipo -info "build-darwin-universal/packages/lib/release/$lib.a"
          done

      - name: Build
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Publish the disk image
        uses: actions/upload-artifact@v7
        with:
          name: KStorm-mac
          path: build-darwin-*/newview/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: kstorm-linux-${{ github.ref }}
      cancel-in-progress: true
    env:
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
      XZ_DEFAULTS: -T0
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout build vars (after the main code)
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      # The hosted machine starts too full for a viewer build.
      - name: Free disk space
        shell: bash
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      # The package list follows Firestorm's build_viewer.yml ("Install required Ubuntu packages").
      # Since Firestorm 7.3.0 the Linux build links the system libvlc, PipeWire, GStreamer, D-Bus
      # and Wayland through pkg-config, so their -dev packages must be installed.
      - name: Install GCC 14 and the build packages
        shell: bash
        run: |
          dependencies=(
            gcc-14 g++-14
            python3-setuptools pkg-config ninja-build mesa-common-dev
            libgl1-mesa-dev libglu1-mesa-dev libosmesa6-dev
            libxinerama-dev libxrandr-dev libxcursor-dev libxfixes-dev libxft-dev
            libpulse-dev libunwind-dev libpipewire-0.3-dev libdbus-1-dev
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
            libvlc-dev libwayland-dev libfreetype6-dev libfontconfig1-dev
          )
          sudo apt-get update
          sudo apt-get install -y "${dependencies[@]}"
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set PYTHON environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install python requirements
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Cache third-party packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: autobuild-linux-${{ hashFiles('autobuild.xml') }}

      - name: Configure
        shell: bash
        run: autobuild configure -A 64 -c ReleaseFS_open -- --chan Research --no-opensim --package -DLL_TESTS:BOOL=FALSE

      - name: Build
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Publish the archive
        uses: actions/upload-artifact@v7
        with:
          name: KStorm-linux
          path: build-linux-*/newview/*.tar.xz
          if-no-files-found: error
          retention-days: 7

  # A draft and a pre-release: nothing is public until it is published by hand on GitHub.
  release:
    if: ${{ inputs.windows && inputs.release_tag != '' }}
    needs: [shaders, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Get the installer
        uses: actions/download-artifact@v8
        with:
          name: KStorm-windows
          path: dist

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in
            kstorm-*) ;;
            *) echo "::error::The tag must start with kstorm-"; exit 1 ;;
          esac
          installer="$(find dist -name '*Setup.exe' -print -quit)"
          test -n "$installer"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/kstorm-release-page.md?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw" > page.md
          sed -i -e "s/@VERSION@/${TAG#kstorm-}/g" -e "s/@TAG@/$TAG/g" page.md
          gh release create "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "$TAG" --draft --prerelease             --notes-file page.md
