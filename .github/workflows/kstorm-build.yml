# KStorm's own build. Started by hand from the Actions tab; Windows only for now.
# ReleaseFS_open needs no secrets: every package downloads anonymously, and the
# installer is unsigned because the signing helpers skip when their variables are unset.
name: KStorm build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Build Windows (untick for the shader check alone)'
        type: boolean
        default: true
      release_tag:
        description: 'Make a draft release with this tag, e.g. kstorm-7.2.5.12345 (needs Build Windows; blank for none)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      # Validates each changed shader in the variants the viewer compiles.
      - name: Validate shaders changed since master (GLSL 4.10)
        shell: bash
        run: bash scripts/ks_check_shaders.sh $(git diff --name-only --diff-filter=d origin/master...HEAD -- '*.glsl')

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 360
    # Only here, so that a shader-only run can't cancel a Windows build in progress.
    concurrency:
      group: kstorm-windows-${{ github.ref }}
      cancel-in-progress: true
    env:
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
    steps:
      # Full history: the build number is the commit count (indra/cmake/BuildVersion.cmake).
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout build vars (after the main code)
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set PYTHON environment for CMake
        shell: bash
        run: echo "PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install python requirements
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Cache third-party packages
        uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: autobuild-windows-${{ hashFiles('autobuild.xml') }}

      - name: Configure
        shell: bash
        run: autobuild configure -A 64 -c ReleaseFS_open -- --chan Research --no-opensim --avx2 --package -DLL_TESTS:BOOL=FALSE

      - name: Build
        shell: bash
        run: autobuild build -A 64 -c ReleaseFS_open --no-configure

      - name: Publish the installer
        uses: actions/upload-artifact@v7
        with:
          name: KStorm-windows
          path: build-*/newview/Release/*Setup.exe
          if-no-files-found: error
          retention-days: 7

  # A draft and a pre-release: nothing is public until it is published by hand on GitHub.
  release:
    if: ${{ inputs.windows && inputs.release_tag != '' }}
    needs: [shaders, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Get the installer
        uses: actions/download-artifact@v8
        with:
          name: KStorm-windows
          path: dist

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          case "$TAG" in
            kstorm-*) ;;
            *) echo "::error::The tag must start with kstorm-"; exit 1 ;;
          esac
          installer="$(find dist -name '*Setup.exe' -print -quit)"
          test -n "$installer"
          gh release create "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "$TAG" --draft --prerelease             --notes "Unsupported research viewer for Second Life. The installer is unsigned, so Windows SmartScreen will warn."
