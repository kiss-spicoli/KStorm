<!DOCTYPE html>
<!--
  KStorm login page, loaded locally by FSPanelLogin::loadLoginPage (no web request).
  Background: put an image named background.jpg in this folder; it is scaled to cover
  the page. Until then the dark gradient below shows.
  "Research" is letter-spaced by the script below to the width of "KStorm", less 10% of the spacing.
  @author Kissmy Spicoli
-->
<html>
<head>
<meta charset="utf-8">
<title>KStorm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    /* background.jpg on top; the gradient shows when it is missing */
    background:
      url("background.jpg") center / cover no-repeat,
      radial-gradient(ellipse at 50% 40%, #2b2140 0%, #121018 70%);
    display: flex; align-items: center; justify-content: center;
    color: #ffffff; text-align: center;
    user-select: none; cursor: default;
  }
  /* margin-bottom lifts the title's centre to 40% of the height, clear of the login controls,
     which sit just above the lower-third line */
  .block { display: inline-flex; flex-direction: column; align-items: center; margin-bottom: 20vh; }
  .title {
    /* heaviest Windows UI font; Arial Black as fallback */
    font-family: "Segoe UI Black", "Segoe UI", "Arial Black", sans-serif;
    font-weight: 900; font-size: 132px; line-height: 1;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75);
  }
  .buildinfo {
    position: fixed; right: 14px; bottom: 10px;
    font-family: "Segoe UI", Verdana, sans-serif; font-size: 12px;
    color: rgba(230, 222, 245, 0.6);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  }
  .subtitle {
    font-family: "Segoe UI Light", "Segoe UI", Verdana, sans-serif;
    font-weight: 300; font-size: 34px; margin-top: 10px; white-space: nowrap;
    color: #e6def5;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>
  <div class="block">
    <div class="title" id="title">KStorm</div>
    <div class="subtitle" id="subtitle">Research</div>
  </div>
  <div class="buildinfo" id="buildinfo"></div>
<script>
  // Build indicator from the URL parameters the viewer passes: version, build, built (date/time).
  // Opened without them (e.g. in a browser), it stays empty.
  (function showBuildInfo()
  {
    var params = new URLSearchParams(window.location.search);
    var parts = [];
    if (params.get("version") && params.get("build"))
    {
      parts.push(params.get("version") + " (" + params.get("build") + ")");
    }
    if (params.get("built"))
    {
      parts.push("built " + params.get("built"));
    }
    document.getElementById("buildinfo").textContent = parts.join("  ·  ");
  })();

  // Spread "Research" toward the width of "KStorm". letter-spacing also adds
  // space after the last letter, so a matching negative right margin keeps it centred.
  function fitSubtitle()
  {
    var title = document.getElementById("title");
    var sub = document.getElementById("subtitle");
    var letters = sub.textContent.length;
    sub.style.letterSpacing = "0px";
    sub.style.marginRight = "0px";
    var target = title.getBoundingClientRect().width;
    var natural = sub.getBoundingClientRect().width;
    if (letters < 2 || natural >= target) return;
    // SPACING_SCALE < 1 keeps "Research" a little narrower than "KStorm" (0.9 = 10% less spacing)
    var SPACING_SCALE = 0.9;
    var spacing = SPACING_SCALE * (target - natural) / (letters - 1);
    sub.style.letterSpacing = spacing + "px";
    sub.style.marginRight = (-spacing) + "px";
  }
  if (document.fonts && document.fonts.ready)
  {
    document.fonts.ready.then(fitSubtitle);
  }
  window.addEventListener("load", fitSubtitle);
</script>
</body>
</html>
